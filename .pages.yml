media:
  - name: files
    label: Dokumenty
    input: public/uploads/files
    output: /uploads/files
    extensions:
      - pdf
      - docx
      - xlsx
      - pptx
      - txt
      - csv
      - ics
    rename: random
  - name: images
    label: Zdjęcia
    input: public/uploads
    output: /uploads
    categories:
      - image
    extensions:
      - png
      - jpg
      - jpeg
      - webp
    rename: random
content:
  - name: posts
    label: Artykuły
    type: collection
    path: content/posts
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - &a1
        name: id
        label: ID
        type: uuid
        hidden: true
        options:
          editable: false
          generate: false
      - name: title
        label: Tytuł
        type: string
        required: true
      - &a2
        name: slug
        label: Adres URL
        type: string
        required: true
        description: Małe litery bez polskich znaków, np. wolontariat
        pattern: &a12
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Użyj małych liter, cyfr i myślników.
      - name: category_id
        label: Kategoria bloga ogólnego
        type: reference
        options:
          collection: categories
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - name: local_category_id
        label: Kategoria bloga Sosnowiec (dla lokalnych artykułów)
        type: reference
        options:
          collection: local_categories
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - name: tags
        label: Tagi
        type: reference
        options:
          collection: tags
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: true
      - name: scope
        label: Publikacja
        type: select
        default: general
        options:
          values:
            - name: general
              label: Blog ogólny
            - name: sosnowiec
              label: Blog + Z Sosnowca
      - name: excerpt
        label: Wprowadzenie
        type: text
      - &a3
        name: body
        label: Treść
        type: rich-text
        required: true
        options:
          format: html
          media: images
          switcher: true
      - &a4
        name: faq
        label: Pytania i odpowiedzi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.question}"
        description: Dodaj prawdziwe pytania czytelników i krótkie, rzeczowe odpowiedzi.
          Będą widoczne na stronie; nie gwarantuje to specjalnego wyniku Google.
        fields:
          - name: question
            label: Pytanie
            type: string
            required: true
          - name: answer
            label: Odpowiedź
            type: text
            required: true
      - name: summary_points
        label: Najważniejsze w skrócie — po jednym punkcie
        type: string
        list: true
      - name: related_page_ids
        label: Powiązane podstrony — pokaż tam ten artykuł
        type: reference
        options:
          collection: pages
          search: fields.title
          value: "{fields.id}"
          label: "{fields.title}"
          multiple: true
      - &a13
        name: tiles
        label: Kafelki informacyjne
        type: object
        description: Dodaj kafelek, wpisz tytuł, opis i opcjonalny odnośnik. Możesz
          zmieniać kolejność.
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Tytuł kafelka
            type: string
            required: true
          - name: text
            label: Opis
            type: text
          - name: url
            label: Odnośnik HTTPS lub /adres/
            type: string
      - name: cover_style
        label: Kolor kafelka artykułu
        type: select
        default: sage
        options:
          values:
            - name: sage
              label: Szałwia
            - name: sand
              label: Piasek
            - name: lilac
              label: Lawenda
            - name: rose
              label: Brzoskwinia
      - name: related_place_ids
        label: Powiązane miejsca pomocy
        type: reference
        options:
          collection: places
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: true
      - name: image
        label: Zdjęcie główne
        type: image
        options:
          media: images
      - name: image_alt
        label: Opis alternatywny zdjęcia
        type: string
      - name: author
        label: Autor
        type: string
        default: Igor Pabiańczyk
      - name: author_id
        label: Profil autora (opcjonalnie, ma pierwszeństwo przed wpisanym nazwiskiem)
        type: reference
        options:
          collection: authors
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - &a5
        name: status
        label: Status
        type: select
        default: draft
        options:
          values:
            - name: draft
              label: Szkic
            - name: published
              label: Opublikowany
            - name: scheduled
              label: Zaplanowany
            - name: trashed
              label: Kosz
      - &a6
        name: published_at
        label: Termin publikacji
        type: date
        description: Aby pokazać treść od razu, wybierz bieżącą lub wcześniejszą datę i
          godzinę. Przyszły termin wstrzymuje publikację także przy statusie
          Opublikowany.
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
      - &a7
        name: updated_at
        label: Data aktualizacji
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
      - name: featured
        label: Wyróżnij na głównej
        type: boolean
      - name: toc
        label: Pokaż spis treści
        type: boolean
        default: true
      - name: sources
        label: Źródła — po jednym adresie HTTPS w wierszu
        type: text
      - &a8
        name: seo_title
        label: Tytuł dla Google (opcjonalny)
        type: string
        description: Zostaw puste, aby użyć tytułu wpisu. Pisz naturalnie, np. Darmowa pomoc prawna w Sosnowcu – jak się zapisać? Nie dodawaj listy słów kluczowych.
      - &a9
        name: seo_description
        label: Opis dla Google (opcjonalny)
        type: text
        description: Puste pole automatycznie korzysta z wprowadzenia lub początku treści. Własny opis powinien krótko wyjaśniać, co czytelnik znajdzie na stronie. Google może wybrać inny fragment.
      - &a10
        name: canonical_url
        label: Adres kanoniczny — automatyczny, zostaw puste
        type: string
        description: Wypełnij tylko przy świadomym wskazaniu oryginału przedruku. Dla
          własnych tekstów adres wylicza się automatycznie.
      - &a11
        name: noindex
        label: Nie indeksuj tej treści
        type: boolean
        default: false
    view:
      primary: title
      fields:
        - title
        - status
        - category_id
        - published_at
      sort:
        - published_at
        - title
      default:
        sort: published_at
        order: desc
  - name: pages
    label: Podstrony
    type: collection
    path: content/pages
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: title
        label: Tytuł
        type: string
        required: true
      - *a2
      - name: notice
        label: Ważny komunikat / status projektu (opcjonalnie)
        type: text
      - name: section
        label: Gdzie ma być podstrona?
        type: select
        default: general
        options:
          values:
            - name: general
              label: "Strona główna: /twoj-adres/"
            - name: sosnowiec
              label: "Sosnowiec: /sosnowiec/twoj-adres/"
      - name: local_category_id
        label: Kategoria lokalnej podstrony (opcjonalnie)
        type: reference
        options:
          collection: local_categories
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - name: excerpt
        label: Wprowadzenie
        type: text
      - *a3
      - *a4
      - name: show_updates
        label: Pokaż dział aktualności i osobny RSS
        type: boolean
        default: false
      - *a13
      - name: image
        label: Zdjęcie główne podstrony
        type: image
        description: Własne lub legalnie udostępnione zdjęcie związane z tematem. Najlepiej co najmniej 1200 pikseli szerokości; nie sam napis lub logo.
        options:
          media: images
      - name: image_alt
        label: Co przedstawia zdjęcie?
        type: string
        description: Opisz faktyczną zawartość zdjęcia. Nie wpisuj listy słów kluczowych.
      - name: related_category_id
        label: Powiązana kategoria (opcjonalnie)
        type: reference
        options:
          collection: categories
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - *a5
      - *a6
      - *a7
      - name: show_in_nav
        label: Pokaż w menu głównym
        type: boolean
        default: false
      - name: menu_label
        label: Krótka nazwa w menu
        type: string
      - name: nav_order
        label: Kolejność w menu (0–100)
        type: number
        default: 50
        options:
          min: 0
          max: 100
      - *a8
      - *a9
      - *a10
      - *a11
    view:
      primary: title
      fields:
        - title
        - slug
        - status
        - show_in_nav
  - name: places
    label: Pomoc w Sosnowcu
    type: collection
    path: content/places
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Nazwa
        type: string
        required: true
      - name: slug
        label: Adres URL
        type: string
        required: false
        description: Adres wizytówki. Dla nowej jednostki wpisz np.
          zespol-interdyscyplinarny.
        pattern: *a12
      - name: section
        label: Zakładka
        type: select
        default: institution
        options:
          values:
            - name: mops
              label: MOPS i działy
            - name: institution
              label: Inne instytucje
      - name: parent_id
        label: Jednostka nadrzędna (opcjonalnie)
        type: reference
        options:
          collection: places
          search: fields.name
          value: "{fields.id}"
          label: "{fields.name}"
          multiple: false
      - name: description
        label: Opis
        type: text
      - *a13
      - name: opening_hours
        label: Godziny i sposób umawiania wizyty
        type: text
      - name: accessibility
        label: Dostępność — tylko potwierdzone informacje
        type: text
      - name: preparation
        label: Co przygotować przed kontaktem
        type: string
        list: true
      - name: address
        label: Adres
        type: string
      - name: phone
        label: Telefon
        type: string
      - name: email
        label: E-mail
        type: string
      - name: website
        label: Oficjalna strona
        type: string
      - name: city
        label: Miasto
        type: string
        default: Sosnowiec
        readonly: true
      - name: verified_at
        label: Data sprawdzenia kontaktu
        type: string
      - name: status
        label: Status
        type: select
        default: draft
        options:
          values:
            - name: draft
              label: Szkic
            - name: published
              label: Opublikowany
    view:
      primary: name
      fields:
        - name
        - section
        - status
  - name: links
    label: Krótkie linki i kody QR
    type: collection
    path: content/links
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Nazwa linku
        type: string
        required: true
      - name: slug
        label: Krótka nazwa adresu
        type: string
        required: true
        description: Np. mops — otrzymasz mostpomocy.pl/l/mops/. Po wydrukowaniu QR nie
          zmieniaj tej nazwy; możesz zmieniać cel.
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Małe litery, cyfry i myślniki, maksymalnie 48 znaków.
      - name: target_url
        label: Pełny adres docelowy HTTPS
        type: string
        required: true
        description: Może prowadzić poza MostPomocy, np.
          https://www.mopssosnowiec.pl/wolontariat.html. Adres jest publiczny —
          bez haseł, tokenów i prywatnych dokumentów.
      - name: source
        label: Miejsce / źródło
        type: string
        required: true
        default: mostpomocy
        description: Małe litery, cyfry, podkreślenia; np. mops_sosnowiec. Bez danych osób.
      - name: medium
        label: Typ materiału
        type: select
        default: short_link
        options:
          values:
            - name: short_link
              label: Krótki link
            - name: qr
              label: Kod QR / druk
      - name: campaign
        label: Kampania
        type: string
        required: true
        default: linki_2026
        description: Np. wolontariat_2026. Małe litery, cyfry i podkreślenia.
      - name: status
        label: Status
        type: select
        default: draft
        options:
          values:
            - name: draft
              label: Szkic
            - name: published
              label: Opublikowany
            - name: trashed
              label: Kosz
    view:
      primary: name
      fields:
        - name
        - slug
        - status
        - target_url
  - name: authors
    label: Autorzy — profile i podpisy
    type: collection
    path: content/authors
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Imię i nazwisko
        type: string
        required: true
      - *a2
      - name: role
        label: Rola / potwierdzone kwalifikacje
        type: string
      - name: bio
        label: Biogram
        type: text
      - name: website
        label: Strona autora (opcjonalnie)
        type: string
    view:
      primary: name
      fields:
        - name
        - role
  - name: categories
    label: Kategorie
    type: collection
    path: content/categories
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Nazwa
        type: string
        required: true
      - *a2
      - name: description
        label: Opis kategorii
        type: text
    view:
      primary: name
      fields:
        - name
        - slug
  - name: local_categories
    label: Sosnowiec — kategorie
    type: collection
    path: content/local_categories
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Nazwa
        type: string
        required: true
      - *a2
      - name: description
        label: Opis
        type: text
    view:
      primary: name
      fields:
        - name
        - slug
  - name: tags
    label: Tagi
    type: collection
    path: content/tags
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: name
        label: Nazwa
        type: string
        required: true
      - *a2
      - name: description
        label: Opis tagu
        type: text
    view:
      primary: name
      fields:
        - name
        - slug
  - name: events
    label: Wydarzenia
    type: collection
    path: content/events
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: title
        label: Nazwa wydarzenia
        type: string
        required: true
      - *a2
      - name: excerpt
        label: Krótki opis
        type: text
      - *a3
      - name: starts_at
        label: Początek
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
      - name: ends_at
        label: Koniec (opcjonalnie)
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
      - name: location
        label: Miejsce lub informacja o wydarzeniu online
        type: string
      - name: organizer
        label: Organizator
        type: string
      - name: scope
        label: Zasięg
        type: select
        options:
          values:
            - name: general
              label: Ogólnopolskie
            - name: sosnowiec
              label: Sosnowiec
        default: sosnowiec
      - name: registration_url
        label: Oficjalny adres zapisów HTTPS (opcjonalnie)
        type: string
      - name: accessibility
        label: Informacje o dostępności
        type: text
      - *a5
      - *a6
      - *a7
      - *a8
      - *a9
      - *a10
      - *a11
    view:
      primary: title
      fields:
        - title
        - starts_at
        - scope
        - status
  - name: galleries
    label: Galerie zdjęć
    type: collection
    path: content/galleries
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: title
        label: Tytuł
        type: string
        required: true
      - *a2
      - name: excerpt
        label: Opis
        type: text
      - name: images
        label: Zdjęcia
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.alt}"
        fields:
          - name: src
            label: Zdjęcie
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Opis alternatywny
            type: string
            required: true
          - name: caption
            label: Podpis
            type: text
          - name: credit
            label: Autor / źródło i prawa do zdjęcia
            type: string
      - *a5
      - *a6
      - *a7
      - *a8
      - *a9
      - *a10
      - *a11
    view:
      primary: title
      fields:
        - title
        - status
        - published_at
  - name: downloads
    label: Pliki do pobrania
    type: collection
    path: content/downloads
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: title
        label: Nazwa pliku
        type: string
        required: true
      - name: description
        label: Opis
        type: text
      - name: file
        label: Plik
        type: file
        required: true
        options:
          media: files
      - name: format
        label: Format, np. PDF
        type: string
      - name: accessibility
        label: Dostępność dokumentu lub alternatywa tekstowa
        type: text
      - *a5
      - *a6
      - *a7
    view:
      primary: title
      fields:
        - title
        - format
        - status
  - name: banners
    label: Komunikaty i banery
    type: collection
    path: content/banners
    format: json
    filename:
      template: "{fields.id}.json"
      field: false
    fields:
      - *a1
      - name: title
        label: Tytuł
        type: string
        required: true
      - name: description
        label: Treść
        type: text
      - name: url
        label: Odnośnik /adres/ lub HTTPS
        type: string
      - name: scope
        label: Gdzie pokazać
        type: select
        default: all
        options:
          values:
            - name: all
              label: Cała strona
            - name: sosnowiec
              label: Tylko Sosnowiec
      - *a5
      - *a6
      - *a7
    view:
      primary: title
      fields:
        - title
        - scope
        - status
  - name: settings
    label: Google, SEO i ustawienia strony
    type: file
    path: content/settings/main.json
    format: json
    fields:
      - *a4
      - name: id
        label: ID
        type: string
        hidden: true
        default: main
      - name: title
        label: Nazwa strony
        type: string
        required: true
      - name: description
        label: Domyślny opis strony
        type: text
      - name: site_url
        label: Publiczny adres HTTPS
        type: string
        required: true
      - name: repository
        label: Repozytorium
        type: string
        readonly: true
      - name: branch
        label: Gałąź publikacji
        type: string
        readonly: true
      - name: author_name
        label: Autor
        type: string
      - name: contact_email
        label: Publiczny adres e-mail
        type: string
      - name: about
        label: O projekcie
        type: text
      - name: default_image
        label: Domyślny obraz udostępniania
        type: image
        options:
          media: images
      - name: ga_measurement_id
        label: Google Analytics 4 — identyfikator G-…
        type: string
      - name: ga_property_id
        label: Numer usługi GA4 — same cyfry (do raportów)
        type: string
      - name: google_client_id
        label: Google OAuth Client ID — do prywatnych raportów w panelu
        type: string
        description: Publiczny identyfikator klienta aplikacji internetowej. Żadnych
          kluczy prywatnych. Instrukcja w /admin/.
      - name: navigation
        label: Dodatkowe linki menu
        type: object
        list: true
        fields:
          - name: label
            label: Nazwa
            type: string
            required: true
          - name: url
            label: Adres na stronie, np. /wydarzenia/
            type: string
            required: true
      - name: google_verification
        label: Google Search Console — kod weryfikacyjny
        type: string
      - name: bing_verification
        label: Bing Webmaster Tools — kod weryfikacyjny
        type: string
      - name: allow_indexing
        label: Zezwól na indeksowanie publicznej strony
        type: boolean
        default: true
      - name: allow_ai_search
        label: Publikuj opcjonalny spis llms.txt dla narzędzi AI
        type: boolean
        default: true
      - name: social_profiles
        label: Oficjalne profile autora / projektu
        type: string
        list: true
      - name: footer_note
        label: Tekst stopki
        type: text
actions:
  - name: check-content
    label: Sprawdź treści i odnośniki
    workflow: check-content.yml
    confirm: false
  - name: publish
    label: Zbuduj i opublikuj stronę
    workflow: pages.yml
    confirm:
      title: Opublikować aktualną treść?
      message: Uruchomi budowanie strony na GitHub Pages.
      button: Publikuj
