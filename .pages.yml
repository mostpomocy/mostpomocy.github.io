media:
  input: public/images
  output: /images
  categories: ["image"]

content:
  - name: cms
    label: MostPomocy CMS
    type: file
    path: README.md
    fields:
      - { name: body, label: Informacje dla redakcji, type: rich-text }

  - name: blog-polska
    label: Blog ogólnopolski
    type: collection
    path: src/content/blog-polska
    filename: "{fields.fileSlug}.md"
    view:
      fields: [title, publicationDate, author, category, draft]
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: fileSlug, label: Slug (nazwa pliku), type: string, required: true }
      - { name: description, label: Opis, type: string, required: true }
      - { name: publicationDate, label: Data publikacji, type: date, required: true, options: { time: true } }
      - { name: lastUpdated, label: Data aktualizacji, type: date, options: { time: true } }
      - { name: featuredImage, label: Zdjęcie wyróżniające, type: image, required: true }
      - { name: featuredImageAlt, label: Opis alternatywny zdjęcia, type: string, required: true }
      - { name: author, label: Autor, type: string, required: true }
      - { name: category, label: Kategoria, type: string, required: true }
      - { name: tags, label: Tagi, type: string, list: true }
      - { name: draft, label: Szkic, type: boolean, default: false }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: SEO title, type: string, required: true }
          - { name: description, label: SEO description, type: string, required: true }
      - { name: body, label: Treść, type: rich-text, required: true }

  - name: blog-sosnowiec
    label: Blog Sosnowiec
    type: collection
    path: src/content/blog-sosnowiec
    filename: "{fields.fileSlug}.md"
    view:
      fields: [title, publicationDate, author, category, draft]
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: fileSlug, label: Slug (nazwa pliku), type: string, required: true }
      - { name: description, label: Opis, type: string, required: true }
      - { name: publicationDate, label: Data publikacji, type: date, required: true, options: { time: true } }
      - { name: lastUpdated, label: Data aktualizacji, type: date, options: { time: true } }
      - { name: featuredImage, label: Zdjęcie wyróżniające, type: image, required: true }
      - { name: featuredImageAlt, label: Opis alternatywny zdjęcia, type: string, required: true }
      - { name: author, label: Autor, type: string, required: true }
      - { name: category, label: Kategoria, type: string, required: true }
      - { name: tags, label: Tagi, type: string, list: true }
      - { name: draft, label: Szkic, type: boolean, default: false }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: SEO title, type: string, required: true }
          - { name: description, label: SEO description, type: string, required: true }
      - { name: body, label: Treść, type: rich-text, required: true }

  - name: wsparcie
    label: Rodzaje wsparcia
    type: collection
    path: src/content/wsparcie
    filename: "{fields.fileSlug}.md"
    view:
      fields: [title, fileSlug]
    fields:
      - { name: title, label: Tytuł, type: string, required: true }
      - { name: fileSlug, label: Slug (nazwa pliku), type: string, required: true }
      - { name: shortDescription, label: Krótki opis, type: string, required: true }
      - { name: problemDescription, label: Opis problemu, type: string, required: true }
      - { name: odCzegoZaczac, label: Od czego zacząć?, type: string, list: true }
      - { name: kiedySzukacWsparcia, label: Kiedy szukać wsparcia?, type: string, list: true }
      - { name: formyPomocy, label: Formy pomocy, type: string, list: true }
      - { name: pierwszyKontakt, label: Instrukcja pierwszego kontaktu, type: string, list: true }
      - { name: wazneInformacje, label: Ważne informacje, type: string, list: true }
      - name: kontakty
        label: Przydatne kontakty
        type: object
        list: true
        fields:
          - { name: name, label: Nazwa, type: string }
          - { name: description, label: Opis, type: string }
          - { name: phone, label: Telefon, type: string }
          - { name: website, label: Strona WWW, type: string }
          - { name: verified, label: Zweryfikowane, type: boolean, default: false }
      - name: zrodla
        label: Wiarygodne źródła
        type: object
        list: true
        fields:
          - { name: title, label: Nazwa źródła, type: string }
          - { name: url, label: Link, type: string }
      - { name: relatedArticles, label: Powiązane artykuły (slug), type: string, list: true }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: SEO title, type: string, required: true }
          - { name: description, label: SEO description, type: string, required: true }
      - { name: body, label: Treść, type: rich-text }

  - name: sosnowiec
    label: Sosnowiec
    type: file
    path: src/content/miasta/sosnowiec.md
    fields:
      - { name: name, label: Nazwa miasta, type: string }
      - { name: heroTitle, label: Hero tytuł, type: string }
      - { name: heroSubtitle, label: Hero podtytuł, type: string }
      - { name: heroDescription, label: Hero opis, type: string }
      - name: sections
        label: Sekcje lokalne
        type: object
        list: true
        fields:
          - { name: id, label: Id sekcji, type: string }
          - { name: title, label: Tytuł sekcji, type: string }
          - { name: description, label: Opis sekcji, type: string }
          - { name: points, label: Punkty, type: string, list: true }
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title, label: SEO title, type: string, required: true }
          - { name: description, label: SEO description, type: string, required: true }
      - { name: body, label: Treść, type: rich-text }

  - name: strony
    label: Strony
    type: collection
    path: src/pages
    include:
      - kompas-pomocy.astro
      - bezpiecznik.astro
      - edukacja.astro
      - o-projekcie.astro
      - polityka-prywatnosci.astro
    fields:
      - { name: body, label: Treść pliku, type: code, options: { language: astro } }

  - name: ustawienia-serwisu
    label: Ustawienia serwisu
    type: file
    path: astro.config.mjs
    fields:
      - { name: body, label: Konfiguracja Astro, type: code, options: { language: javascript } }

  - name: media
    label: Media
    type: file
    path: README.md
    fields:
      - { name: body, label: Informacje o mediach, type: rich-text }
